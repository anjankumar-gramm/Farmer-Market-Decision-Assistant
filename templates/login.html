<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FMDA</title>

    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">FMDA</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html" class="nav-button">Register</a>
        </div>
    </nav>


    <main class="auth-page">

        <div class="auth-card">

            <h1>Welcome back</h1>

            <p class="auth-subtitle">
                Login to access your farmer dashboard.
            </p>


            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="form-button">
                    Login
                </button>

            </form>


            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>

    </main>


    <footer>
        <strong>Farmer Market Decision Assistant</strong>
        <p>Technology for smarter agricultural decisions.</p>
    </footer>


    <script src="../static/js/script.js"></script>

</body>
</html>
